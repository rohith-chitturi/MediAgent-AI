version: '3.9'

services:
  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mediagent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediagent
      POSTGRES_PASSWORD: mediagent_pass
      POSTGRES_DB: mediagent_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mediagent -d mediagent_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mediagent_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (Node.js / Express) ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediagent_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      DATABASE_URL: postgresql://mediagent:mediagent_pass@postgres:5432/mediagent_db
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
      AI_AGENT_SERVICE_URL: http://ai-agents:8000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  # ─── AI Agents (Python / FastAPI / LangGraph) ─────────────────
  ai-agents:
    build:
      context: ./ai-agents
      dockerfile: Dockerfile
    container_name: mediagent_ai_agents
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql://mediagent:mediagent_pass@postgres:5432/mediagent_db
      REDIS_URL: redis://redis:6379
      BACKEND_API_URL: http://backend:5000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ai-agents:/app

  # ─── Frontend (React / Vite) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediagent_frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_WS_URL: http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
  redis_data:
